name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Pytest with Coverage
        run: |
          pytest backend/tests --cov=backend/core --cov=backend/adapters --cov=backend/features --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-test:
    name: Frontend Build, Secret Scan & Playwright Demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Static Demo Bundle
        run: npm run build:demo

      - name: Run Build Secret Scanner
        run: python ../scripts/verify_frontend_secrets.py
        working-directory: .

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Execute Demo Mode E2E Test
        run: npm run test:demo
