name: Keep-Alive & Cache Warmer

on:
  schedule:
    # Trigger every 12 minutes (Render spins down after 15 min idle)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive & Cache Warm Ping
        run: |
          echo "Sending refresh ping to Apex Terminal API..."
          TARGET_URL="${{ secrets.BACKEND_API_URL || 'https://stock-dashboard-api.onrender.com' }}/internal/refresh-cache"
          SECRET="${{ secrets.INTERNAL_REFRESH_SECRET }}"
          if [ -z "$SECRET" ]; then
            echo "ERROR: INTERNAL_REFRESH_SECRET repository secret is not set!"
            exit 1
          fi
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
            -H "X-Internal-Secret: $SECRET" \
            -H "Content-Type: application/json" \
            --max-time 15)
          
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "Warning: Cache warmer ping failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Cache warmed and container kept warm successfully!"
