name: Keep-Alive & Cache Warmer

on:
  schedule:
    # Keep the Render service warm and register daily database activity in Supabase.
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    env:
      BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://stock-dashboard-api.onrender.com' }}
      INTERNAL_REFRESH_SECRET: ${{ secrets.INTERNAL_REFRESH_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Record lightweight Supabase database activity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "ERROR: SUPABASE_URL and SUPABASE_KEY repository secrets are required."
            exit 1
          fi

          STATUS=$(curl -sS --max-time 20 -o /tmp/mara-supabase-ping.txt -w "%{http_code}" \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/mara_healthcheck" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')
          BODY=$(cat /tmp/mara-supabase-ping.txt)
          if [[ "$STATUS" != "200" || "$BODY" != "1" ]]; then
            echo "ERROR: Supabase activity ping failed (HTTP $STATUS, response: $BODY)."
            exit 1
          fi
          echo "Supabase health query returned 1."

      - name: Keep Render awake and schedule cache refresh
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$INTERNAL_REFRESH_SECRET" ]]; then
            echo "ERROR: INTERNAL_REFRESH_SECRET repository secret is not set."
            exit 1
          fi

          STATUS=$(curl -sS --max-time 20 -o /tmp/mara-cache-ping.txt -w "%{http_code}" \
            -X POST "${BACKEND_API_URL%/}/internal/refresh-cache" \
            -H "X-Internal-Secret: $INTERNAL_REFRESH_SECRET" \
            -H "Content-Type: application/json")
          BODY=$(cat /tmp/mara-cache-ping.txt)
          if [[ "$STATUS" != "200" && "$STATUS" != "202" ]]; then
            echo "ERROR: Cache refresh ping failed (HTTP $STATUS, response: $BODY)."
            exit 1
          fi
          echo "Cache refresh queued and backend ping completed."
