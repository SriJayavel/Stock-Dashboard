<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1710"/>
      <stop offset="100%" stop-color="#090908"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd9140"/>
      <stop offset="48%" stop-color="#d9b35f"/>
      <stop offset="100%" stop-color="#f0d58d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(217, 179, 95, 0.48)"/>
      <stop offset="100%" stop-color="rgba(217, 179, 95, 0.16)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Dynamic Geometric 'M' with Ascending Trend Vector -->
  <path d="M15 45 L15 22 L27 34 L37 23 L49 35" fill="none" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Upward Trend Beacon -->
  <path d="M37 23 L49 13" stroke="#e4c578" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="49" cy="13" r="3.5" fill="#e4c578" filter="url(#glow)"/>
  <circle cx="49" cy="13" r="1.5" fill="#ffffff"/>
</svg>
