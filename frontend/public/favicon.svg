<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c122c"/>
      <stop offset="100%" stop-color="#040612"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.25)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmos Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Cosmic Monogram 'M' with Ascending Nebula Vector -->
  <path d="M15 45 L15 22 L27 34 L37 23 L49 35" fill="none" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Pulsar Beacon -->
  <path d="M37 23 L49 13" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="49" cy="13" r="3.5" fill="#00f5d4" filter="url(#glow)"/>
  <circle cx="49" cy="13" r="1.5" fill="#ffffff"/>
</svg>
