<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111215"/>
      <stop offset="100%" style="stop-color:#1C1E23"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(52,211,153,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent line -->
  <path d="M 120 280 Q 300 200 480 280 T 840 280" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3"/>
  <path d="M 120 350 Q 300 430 480 350 T 840 350" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.2"/>

  <!-- Logo area -->
  <circle cx="200" cy="180" r="56" fill="url(#accentGrad)"/>
  <path d="M 170 180 L 195 205 L 235 155" fill="none" stroke="#111215" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="200" y="320" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#E0E2EC" letter-spacing="-1.5">Mara Stock Dashboard</text>

  <!-- Subtitle -->
  <text x="200" y="380" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#A0A4B8">Clarity for market decisions.</text>

  <!-- Feature pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">
    <rect x="200" y="430" width="160" height="40" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)"/>
    <text x="280" y="458" text-anchor="middle" fill="#34D399">TradingView Charts</text>

    <rect x="380" y="430" width="140" height="40" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)"/>
    <text x="450" y="458" text-anchor="middle" fill="#34D399">Valuation Analytics</text>

    <rect x="540" y="430" width="140" height="40" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)"/>
    <text x="610" y="458" text-anchor="middle" fill="#34D399">Strategy Backtesting</text>

    <rect x="700" y="430" width="120" height="40" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)"/>
    <text x="760" y="458" text-anchor="middle" fill="#34D399">Smart Alerts</text>
  </g>

  <!-- Bottom brand -->
  <text x="600" y="570" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">mara-stock-terminal.vercel.app</text>
</svg>
